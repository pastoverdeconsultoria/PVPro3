<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador — app de gestão de pastagem</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0B120E;--card:#121C16;--line:#223028;--line2:#35483C;--text:#EEF3EC;--muted:#9DB0A3;--lime:#C6F24E;--ink:#0B120E;--r1:#1E3A2B;--r2:#2F6B4A;--r3:#5DB383;--warn:#FF8A3D;--unk:#3A433E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--lime)}
.wrap{max-width:1320px;margin:0 auto;padding:20px 24px 120px}
header.top{position:sticky;top:0;z-index:20;background:rgba(11,18,14,.94);border-bottom:1px solid var(--line)}
.topin{max-width:1320px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.farmbtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:none;border:0;padding:4px 0;cursor:pointer;min-height:44px;text-align:left}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:600}
.fname{font-family:'Space Grotesk',Inter,sans-serif;font-size:22px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.tabs a{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500}
.tabs a[aria-current=page]{background:var(--lime);color:var(--ink);font-weight:600}
.sim{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.sim b{color:var(--text);font-weight:600}
@media (max-width:900px){
 .tabs{position:fixed;left:8px;right:8px;bottom:8px;z-index:30;justify-content:space-between;border-radius:20px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.6)}
 .tabs a{flex:1 1 0;flex-direction:column;gap:3px;padding:6px 2px;border-radius:14px;font-size:11px;min-height:54px;justify-content:center}
 .topin{padding:8px 14px}
 .wrap{padding:14px 12px 120px}
 .fname{font-size:19px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.iconbtn{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;min-width:0}
.hero{background:var(--lime);color:var(--ink);border-radius:20px;padding:24px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:16px}
.col{display:flex;flex-direction:column;gap:14px}
.k{font-size:13px;color:var(--muted)}
.h2{margin:0;font-family:'Space Grotesk',Inter,sans-serif;font-size:21px;font-weight:600;letter-spacing:-.01em}
.big{font-family:'Space Grotesk',Inter,sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1}
.view{display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.chip[aria-pressed=true]{background:var(--text);color:var(--ink);border-color:var(--text);font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;color:var(--muted)}
.in{min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font-size:15px;width:100%}
select.in{padding:0 10px}
.in:focus,.chip:focus-visible,.btn:focus-visible,.tabs a:focus-visible,.iconbtn:focus-visible,.modc:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.map{width:100%;height:auto;display:block;touch-action:manipulation}
.map .pad{cursor:pointer;stroke:#121C16;stroke-width:3;stroke-linejoin:round;vector-effect:non-scaling-stroke;outline:none}
.map .pad:focus-visible{stroke:#FFFFFF;stroke-width:4}
.map text,.map .deco{pointer-events:none}
.modc{display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer;color:var(--text);font:inherit;flex:1 1 260px}
.modc[aria-pressed=true]{border-color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:14px;background:#1F1610;border:1px solid #5A3418;font-size:14px}
.alert.info{background:#131D18;border-color:var(--line2)}
.alert b{color:var(--warn)}
.alert.info b{color:var(--lime)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:0 10px 10px 0;white-space:nowrap}
td{padding:11px 10px 11px 0;border-top:1px solid var(--line)}
.num{text-align:right}
.scrollx{overflow-x:auto}
dl.kv{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
dl.kv dt{font-size:12px;color:var(--muted)}
dl.kv dd{margin:4px 0 0;font-size:15px;font-weight:600}
.sheet>*,.modal>*,.modal form>*{flex-shrink:0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40}
.sheet{position:fixed;z-index:41;background:var(--card);border:1px solid var(--line2);display:flex;flex-direction:column;gap:16px;padding:22px;overflow:auto}
@media (min-width:901px){.sheet{top:16px;right:16px;bottom:16px;width:410px;border-radius:24px}}
@media (max-width:900px){.sheet{left:0;right:0;bottom:0;max-height:88vh;border-radius:24px 24px 0 0;padding-bottom:28px}}
.modal{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:16px}
.wiz{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto}
.wizin{max-width:1100px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--text);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:calc(100vw - 32px);text-align:center}
[hidden]{display:none!important}
.bar{height:8px;border-radius:4px;background:var(--line)}
.bar>i{display:block;height:8px;border-radius:4px;background:var(--lime)}
.steps{display:flex;gap:6px}
.steps i{flex:1 1 0;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--lime)}
.err{color:var(--warn);font-size:14px;margin:0}
.muted{color:var(--muted)}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.li{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border-radius:12px;background:var(--bg);min-height:52px}
.li .grow{flex-grow:1;min-width:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:14px}
.chk input{width:20px;height:20px;accent-color:#C6F24E}
.stat3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--bg);border-radius:14px;padding:16px}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.seg{display:flex;gap:6px}
.seg i{flex:1 1 0;height:8px;border-radius:4px;background:var(--line)}
.seg i.on{background:var(--lime)}
.seg i.late{background:var(--warn)}
@media (max-width:900px){
 .simlab{display:none}
 .tile{flex:1 1 100px!important;padding:14px}
 .tile .big{font-size:26px!important}
 .tile .k{font-size:12px}
 .o-hero{order:0}.o-map{order:1}.o-alert{order:2}.o-mod{order:3}
 .o-map{padding:14px}
 .hero .big{font-size:52px!important}
 .h2{font-size:19px}
}
</style>
</head>
<body>
<header class="top"><div class="topin" id="top"></div></header>
<main class="wrap" id="main"></main>
<div id="ov"></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
'use strict';
/* ---------- utilidades ---------- */
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const SEM=['dom','seg','ter','qua','qui','sex','sáb'];
const BASE=Date.UTC(2026,10,13);
const dt=d=>new Date(BASE+d*864e5);
const fD=d=>{const x=dt(d);return x.getUTCDate()+' '+MES[x.getUTCMonth()];};
const fDW=d=>SEM[dt(d).getUTCDay()]+', '+fD(d);
const fDY=d=>fD(d)+' '+dt(d).getUTCFullYear();
const iso=d=>dt(d).toISOString().slice(0,10);
const fromIso=s=>{const t=Date.parse(String(s)+'T00:00:00Z');return isNaN(t)?NaN:Math.round((t-BASE)/864e5);};
const dayUTC=(y,m,d)=>Math.round((Date.UTC(y,m,d)-BASE)/864e5);
const monthOf=d=>dt(d).getUTCMonth();
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=(x,d=2)=>Number(x).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sum=a=>a.reduce((s,x)=>s+x,0);
const r1=x=>Math.round(x*10)/10;
const pl=(n,a,b)=>n===1?a:b;
const uid=p=>p+Math.random().toString(36).slice(2,9);
function rnd(seed,a,b){let x=Math.imul(seed^0x9e3779b9,0x85ebca6b)^Math.imul(a+0x632be5ab,0xc2b2ae35)^Math.imul(b+0x27d4eb2f,0x165667b1);x^=x>>>15;x=Math.imul(x,0x2c1b3c6d);x^=x>>>12;x=Math.imul(x,0x297a2d39);x^=x>>>15;return (x>>>0)/4294967296;}
function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];a+=x1*y2-x2*y1;}return Math.abs(a)/2;}
function polyCent(p){let a=0,cx=0,cy=0;for(let i=0;i<p.length;i++){const[x1,y1]=p[i],[x2,y2]=p[(i+1)%p.length];const c=x1*y2-x2*y1;a+=c;cx+=(x1+x2)*c;cy+=(y1+y2)*c;}if(Math.abs(a)<1e-9)return[sum(p.map(q=>q[0]))/p.length,sum(p.map(q=>q[1]))/p.length];a/=2;return[cx/(6*a),cy/(6*a)];}
const bbW=p=>Math.max(...p.map(q=>q[0]))-Math.min(...p.map(q=>q[0]));
const IC={
 home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
 map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 herd:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>',
 rain:'<path d="M7 15a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8a4 4 0 0 1 0 7"/><path d="M8 18l-1 3M12 18l-1 3M16 18l-1 3"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 x:'<path d="M6 6l12 12M18 6 6 18"/>',up:'<path d="M6 15l6-6 6 6"/>',down:'<path d="M6 9l6 6 6-6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
 move:'<path d="M5 12h14M13 6l6 6-6 6"/>',file:'<path d="M14 3H6v18h12V7z"/><path d="M14 3v4h4"/>'
};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ---------- parâmetros ---------- */
const N_RAIN=[130,110,120,80,45,25,20,18,30,70,140,160];
const TMAX=[31,32,31,30,28,27,26,27,29,30,30,31];
const TMIN=[20,20,20,19,17,15,14,14,16,18,19,20];
const SEASON=[1.05,1.08,1.08,1.05,0.95,0.85,0.75,0.70,0.72,0.82,1.0,1.02];
const CATS=[['Bezerros',180],['Recria',280],['Novilhas',330],['Engorda',440],['Vacas',450],['Touros',650]];
const catW=c=>(CATS.find(x=>x[0]===c)||[0,400])[1];
const SPECIES=['Marandu','Mombaça','Tanzânia','Decumbens','Humidícola','Piatã','Tamani','Zuri','Outro'];
const MOD_COLORS=['#4E79B8','#B87A3E','#8E6CC9','#3FA6A6','#C55A7A','#7F8F3A','#6B7FD6','#B05E3B'];
const NONG=/reserva|app\b|sede|aguada|represa|mata|lago|curral|estrada|benfeitoria/i;
const EX=[[[60,60],[230,30],[220,170],[40,190]],[[230,30],[420,50],[410,200],[220,170]],[[420,50],[600,25],[610,175],[410,200]],[[600,25],[760,70],[775,210],[610,175]],
[[40,190],[220,170],[240,330],[55,340]],[[220,170],[410,200],[400,350],[240,330]],[[410,200],[610,175],[590,335],[400,350]],[[610,175],[775,210],[750,360],[590,335]],
[[55,340],[240,330],[250,495],[90,480]],[[240,330],[400,350],[430,470],[250,495]],[[400,350],[590,335],[600,500],[430,470]],[[590,335],[750,360],[720,470],[600,500]]];
const EX_WATER=[[220,170],[410,200],[610,175],[240,330],[400,350],[590,335]];

/* ---------- modelo ---------- */
const uaLot=l=>l.heads*l.weight/450;
const pad=(f,id)=>f.paddocks.find(p=>p.id===id);
const lotOf=(f,id)=>f.lots.find(l=>l.id===id);
const modOfPad=(f,pid)=>f.modules.find(m=>m.order.includes(pid));
const gPads=f=>f.paddocks.filter(p=>p.grazing);
const gArea=f=>sum(gPads(f).map(p=>p.area));
const openOfLot=(f,lid)=>f.events.find(e=>e.lot===lid&&e.end==null);

function rainEst(f,d){const m=monthOf(d),N=N_RAIN[m]*f.rainMul,n=Math.max(2,Math.round(N/10));if(rnd(f.seed,d,1)<n/30)return r1(-Math.log(1-rnd(f.seed,d,2)*0.97)*N/n);return 0;}
function temps(f,d){const m=monthOf(d),w=rainEst(f,d)>2?-2:0;return[r1(TMIN[m]+rnd(f.seed,d,3)*2-1),r1(TMAX[m]+w+rnd(f.seed,d,4)*2.4-1.2)];}
const realR=(f,d)=>{const r=f.rainReal[d];return r==null?null:r;};
const rainVal=(f,d)=>{const r=realR(f,d);return r==null?rainEst(f,d):r;};

function exampleFarm(){
 const sp=['Marandu','Marandu','Marandu','Marandu','Mombaça','Mombaça','Mombaça','Mombaça','Decumbens','Decumbens','Marandu','Marandu'];
 const pf=[1.0,1.15,0.85,0.8,1.15,1.25,0.85,1.0,1.0,0.75,1.05,1.1];
 const f={id:'ex',name:'Fazenda Exemplo',city:'Itapetinga, BA',seed:20261113,rainMul:1,centroid:{lat:-15.2541,lon:-40.2478},created:-400,seq:0,
  paddocks:EX.map((pts,i)=>({id:'p'+(i+1),name:'P'+String(i+1).padStart(2,'0'),pts,area:r1(polyArea(pts)*16/1e4),species:sp[i],grazing:true,lastExit:null})),
  waters:EX_WATER.map(w=>w.slice()),
  lots:[{id:'l1',name:'Lote 1',cat:'Recria'},{id:'l2',name:'Lote 2',cat:'Engorda'},{id:'l3',name:'Lote 3',cat:'Vacas'}],
  modules:[{id:'mA',name:'Módulo A',color:MOD_COLORS[0],order:['p3','p4','p1','p2'],lotId:'l1',occ:5},{id:'mB',name:'Módulo B',color:MOD_COLORS[1],order:['p7','p8','p5','p6'],lotId:'l2',occ:4},{id:'mC',name:'Módulo C',color:MOD_COLORS[2],order:['p10','p11','p12','p9'],lotId:'l3',occ:6}],
  stays:[],events:[],rainReal:{}};
 const H={l1:420,l2:380,l3:352},WG={l1:[232,0.62,0.22],l2:[398,0.78,0.32],l3:[446,0.12,-0.06]};
 for(const l of f.lots){const[w0,gw,gd]=WG[l.id];let cur=Math.round(H[l.id]*SEASON[monthOf(-400)]);
  l.log=[{id:'g'+l.id+'i',seq:++f.seq,day:-400,type:'inicio',heads:cur,weight:w0,cat:l.cat,note:'Lote formado'}];
  const ws=[-210];for(let d=-177;d<=-9;d+=30+Math.round(rnd(f.seed,d,9)*8))ws.push(d);
  let w=w0,prev=-210;const wk={};ws.forEach((d,k)=>{if(k){for(let x=prev;x<d;x++){const m=monthOf(x);w+=(m>=9||m<=3)?gw:gd;}prev=d;}wk[d]=k?r1(w+(rnd(f.seed,d,10)-0.5)*4):w0;});
  for(let d=-399;d<=0;d++){
   if(dt(d).getUTCDate()===1){const tgt=Math.round(H[l.id]*SEASON[monthOf(d)]),df=tgt-cur;if(df>0)l.log.push({id:uid('g'),seq:++f.seq,day:d,type:'entrada',n:df,reason:'Compra'});if(df<0)l.log.push({id:uid('g'),seq:++f.seq,day:d,type:'saida',n:-df,reason:'Venda'});cur=tgt;}
   if(wk[d]!=null)l.log.push({id:uid('g'),seq:++f.seq,day:d,type:'peso',kg:wk[d],n:cur-Math.round(rnd(f.seed,d,11)*3)});
  }}
 const addSp=(lid,day,pct)=>lotOf(f,lid).log.push({id:uid('g'),seq:++f.seq,day,type:'supl',pct});
 addSp('l3',-400,0.08);
 addSp('l1',dayUTC(2026,4,1),0.2);addSp('l1',dayUTC(2026,10,1),0);
 addSp('l2',dayUTC(2026,4,1),0.5);addSp('l2',dayUTC(2026,7,1),1.0);
 f.modules.forEach(m=>m.history=[{from:-400,order:m.order.slice()}]);
 for(const m of f.modules){let t=-400,i=0;
  for(;;){const pid=m.order[i],d=Math.max(1,Math.round(m.occ*pf[+pid.slice(1)-1]));
   if(t+d>0){f.stays.push({id:uid('s'),lot:m.lotId,pad:pid,start:t,end:null});break;}
   f.stays.push({id:uid('s'),lot:m.lotId,pad:pid,start:t,end:t+d});t+=d;i=(i+1)%m.order.length;}}
 lotOf(f,'l3').log.push({id:'gl3m',seq:++f.seq,day:-3,type:'saida',n:2,reason:'Morte'});
 for(let d=-120;d<0;d++){if(rnd(f.seed,d,7)<0.86){const e=rainEst(f,d);f.rainReal[d]=e===0?0:r1(e*(0.6+0.8*rnd(f.seed,d,8)));}}
 f.proj={efic:0.5,cad:75,rn:26};f.modules[1].cond='adu';f.fert=[];
 [[2025,11,5],[2026,0,20],[2026,2,10],[2026,10,3]].forEach(q=>['p5','p6','p7','p8'].forEach(pid=>f.fert.push({id:uid('a'),pad:pid,day:dayUTC(q[0],q[1],q[2]),n:40})));
 derive(f);
 return f;
}

/* ---------- recálculo a partir dos registros ---------- */
const INTAKE=2.5,LIMIAR=0.3;
const cutF=sp=>Math.max(0,Math.min(sp||0,INTAKE)-LIMIAR)/INTAKE;
const pastoF=sp=>1-cutF(sp);
const uap=e=>e.uap!=null?e.uap:e.ua;
function stateAt(tl,d){let s=null;for(const x of tl){if(x.day<=d)s=x;else break;}return s;}
function derive(f){
 f.seq=f.seq||0;f.stays=f.stays||[];
 for(const l of f.lots){
  const L=(l.log||[]).slice().sort((a,b)=>a.day-b.day||a.seq-b.seq);
  let h=0,w=0,c=l.cat,neg=null,sp=0,spd=null;const tl=[],ws=[];
  for(const x of L){
   if(x.type==='inicio'){h=x.heads;w=x.weight;c=x.cat||c;}
   else if(x.type==='entrada'||x.type==='transf_in'){const kg=x.kg||w;w=h+x.n>0?(h*w+x.n*kg)/(h+x.n):kg;h+=x.n;}
   else if(x.type==='saida'||x.type==='transf_out')h-=x.n;
   else if(x.type==='peso'){w=x.kg;ws.push({id:x.id,day:x.day,kg:x.kg,n:x.n});}
   else if(x.type==='cat')c=x.to;
   else if(x.type==='supl'){sp=x.pct;spd=x.day;}
   if(h<0&&neg==null)neg=x.day;
   const last=tl[tl.length-1];if(last&&last.day===x.day){last.h=h;last.w=w;last.sp=sp;}else tl.push({day:x.day,h,w,sp});
  }
  l.heads=Math.max(0,h);l.weight=r1(w);l.cat=c;l.weighs=ws;l._tl=tl;l._neg=neg;l.supl=sp;l.suplSince=spd;
 }
 const ev=[];
 for(const s of f.stays){const l=lotOf(f,s.lot);if(!l)continue;const tl=l._tl;
  const pts=[s.start,...tl.map(x=>x.day).filter(d=>d>s.start&&(s.end==null||d<s.end))];
  pts.forEach((a,i)=>{const b=i<pts.length-1?pts[i+1]:s.end;const st=stateAt(tl,a);const ua=st&&st.h>0?r1(st.h*st.w/450):0,sp=st?st.sp||0:0;if(ua>0)ev.push({id:s.id+'_'+i,lot:s.lot,pad:s.pad,start:a,end:b,ua,uap:r1(ua*pastoF(sp)),sp});});
 }
 f.events=ev;
}
function closeZero(f){
 for(const l of f.lots){if(l.heads>0)continue;const s=f.stays.find(x=>x.lot===l.id&&x.end==null);if(!s)continue;
  let zd=null;for(let i=l._tl.length-1;i>=0;i--){if(l._tl[i].h<=0)zd=l._tl[i].day;else break;}
  if(zd==null)continue;if(zd<=s.start)f.stays.splice(f.stays.indexOf(s),1);else s.end=zd;}
}
function validate(f){
 for(const l of f.lots){if(l._neg!=null)return `${l.name} ficaria com menos de zero cabeças em ${fDY(l._neg)}.`;
  const ini=(l.log||[]).find(x=>x.type==='inicio');if(ini&&(l.log||[]).some(x=>x.day<ini.day))return `Há registro de ${l.name} antes da formação do lote (${fD(ini.day)}).`;}
 return null;
}
function mutate(f,fn){
 const snap=JSON.stringify({lots:f.lots,stays:f.stays,seq:f.seq,modules:f.modules});
 const restore=()=>{const o=JSON.parse(snap);f.lots=o.lots;f.stays=o.stays;f.seq=o.seq;f.modules=o.modules;derive(f);};
 let r;try{r=fn();}catch(e){r=e.message||'Erro ao salvar.';}
 if(typeof r==='string'){restore();return r;}
 derive(f);closeZero(f);derive(f);
 const err=validate(f);if(err){restore();return err;}
 return null;
}
const openStay=(f,lid)=>f.stays.find(s=>s.lot===lid&&s.end==null);
const firstDay=l=>{const i=(l.log||[]).find(x=>x.type==='inicio');return i?i.day:-1e9;};

function lastOcc(f,pid){
 const cl=f.events.filter(e=>e.pad===pid&&e.end!=null).sort((a,b)=>b.end-a.end);
 if(!cl.length)return null;
 let cur=cl[0],start=cur.start,end=cur.end,ud=cur.ua*(cur.end-cur.start),udp=uap(cur)*(cur.end-cur.start);
 for(;;){const prev=cl.find(e=>e.end===start&&e.lot===cur.lot);if(!prev)break;ud+=prev.ua*(prev.end-prev.start);udp+=uap(prev)*(prev.end-prev.start);start=prev.start;cur=prev;}
 return{start,end,ud,udp,lot:cl[0].lot};
}
function padState(f,p){
 const T=S.today;
 const open=f.events.filter(e=>e.pad===p.id&&e.end==null);
 if(open.length){const ua=sum(open.map(e=>e.ua)),ss=f.stays.filter(x=>x.pad===p.id&&x.end==null),start=ss.length?Math.min(...ss.map(x=>x.start)):Math.min(...open.map(e=>e.start));const up=sum(open.map(uap));return{kind:'occ',ua,up,inst:ua/p.area,instP:up/p.area,day:T-start+1,start,lots:open.map(e=>e.lot)};}
 const o=lastOcc(f,p.id);
 if(o){const rest=T-o.end,dias=o.end-o.start;return{kind:'rest',rest,dias,ocorr:o.ud/p.area/dias,ocorrP:o.udp/p.area/dias,glob:o.ud/p.area/(dias+rest),globP:o.udp/p.area/(dias+rest),lot:o.lot,start:o.start,end:o.end,uaAvg:o.ud/dias};}
 if(p.lastExit!=null)return{kind:'rest',rest:T-p.lastExit,end:p.lastExit,ocorr:null};
 return{kind:'unk'};
}
function modInfo(f,m){
 const T=S.today,pads=m.order.map(id=>pad(f,id)).filter(Boolean),area=sum(pads.map(p=>p.area));
 const openE=f.events.filter(e=>e.end==null&&m.order.includes(e.pad));
 const ua=sum(openE.map(e=>e.ua)),up=sum(openE.map(uap));
 const r={area,ua,up,lotP:area?up/area:0,lot:area?ua/area:0,cur:null,next:null,inN:null,restAt:null,day:null,lotId:m.lotId};
 const e=openE.find(x=>x.lot===m.lotId)||openE[0];
 if(e){const st=openStay(f,e.lot);r.cur=e.pad;r.lotId=e.lot;r.day=T-(st?st.start:e.start)+1;r.inN=m.occ-r.day+1;const i=m.order.indexOf(e.pad);r.next=m.order[(i+1)%m.order.length];
  const ns=padState(f,pad(f,r.next));r.restAt=ns.kind==='rest'?ns.rest+Math.max(r.inN,0):null;}
 return r;
}
function padYear(f,p,a,b){
 let ud=0,udp=0,cyc=0;const days=new Set();
 for(const e of f.events){if(e.pad!==p.id)continue;const end=e.end==null?S.today+1:e.end;const s=Math.max(e.start,a),t=Math.min(end,b);
  if(t>s){ud+=e.ua*(t-s);udp+=uap(e)*(t-s);for(let d=s;d<t;d++)days.add(d);}
  if(e.start>=a&&e.start<b&&!f.events.some(x=>x.pad===p.id&&x.end===e.start&&x.lot===e.lot))cyc++;}
 const n=days.size;return{ud,udp,dias:n,cyc,ocorr:n?ud/p.area/n:0,ocorrP:n?udp/p.area/n:0,glob:ud/p.area/(b-a),globP:udp/p.area/(b-a)};
}
function monthRange(k){const d=dt(S.today),y=d.getUTCFullYear(),m=d.getUTCMonth()-k;const a=Math.round((Date.UTC(y,m,1)-BASE)/864e5),b=Math.round((Date.UTC(y,m+1,1)-BASE)/864e5);return{a,b:Math.min(b,S.today+1),full:b-a,m:((m%12)+12)%12};}

function fresh(){return{today:0,view:'painel',farms:[exampleFarm()],active:'ex',filter:null,rank:'mod',ov:null,draft:null,wiz:null,anView:'hist',projScope:'farm',projM:'cal',projMeta:null,fertDel:null};}

function mapSVG(f,fillFn,o={}){
 const ps=f.paddocks;if(!ps.length)return'<p class="k">Nenhum polígono.</p>';
 let x0=1e12,y0=1e12,x1=-1e12,y1=-1e12;
 ps.forEach(p=>p.pts.forEach(([x,y])=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);}));
 const W=x1-x0,H=y1-y0,pd=Math.max(W,H)*0.025,mob=window.innerWidth<700,fs=W/800*(mob?1.55:1);
 let polys='',labels='',outl='';
 for(const p of ps){
  const st=fillFn(p);
  if(o.mini)polys+=`<polygon points="${p.pts.map(q=>q.join(',')).join(' ')}" fill="${st.fill}" stroke="#121C16" stroke-width="2" vector-effect="non-scaling-stroke"${st.dim?' opacity="0.28"':''}/>`;
  else polys+=`<polygon class="pad" data-act="pad" data-id="${p.id}" role="button" tabindex="0" aria-label="${esc(st.aria)}" points="${p.pts.map(q=>q.join(',')).join(' ')}" fill="${st.fill}"${st.op!=null?` fill-opacity="${st.op}"`:''}${st.dim?' opacity="0.28"':''}/>`;
  if(st.ring)outl+=`<polygon class="deco" points="${p.pts.map(q=>q.join(',')).join(' ')}" fill="none" stroke="${st.ring}" stroke-width="4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`;
  const[cx,cy]=polyCent(p.pts),k=Math.max(0.5,Math.min(1,bbW(p.pts)/(W*0.2))),s=fs*k*(o.mini?1.5:1);
  if(o.mini){labels+=`<text x="${cx}" y="${cy+10*s}" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif" font-size="${(st.l2&&st.l2.length>4?20:26)*s}" font-weight="700" fill="${st.ink}">${esc(st.l2||'')}</text>`;continue;}
  labels+=`<g fill="${st.ink}" text-anchor="middle" font-family="Space Grotesk, Inter, sans-serif"${st.dim?' opacity="0.35"':''}>`;
  if(st.badge!=null)labels+=`<circle cx="${cx}" cy="${cy-46*s}" r="${15*s}" fill="#0B120E"/><text x="${cx}" y="${cy-40*s}" font-size="${16*s}" font-weight="700" fill="#C6F24E">${st.badge}</text>`;
  labels+=`<text x="${cx}" y="${cy-(st.l2?20:4)*s}" font-size="${(mob?15:13)*s}" font-weight="600">${esc(mob?String(st.l1).split(' · ')[0]:st.l1)}</text>`;
  if(st.l2)labels+=`<text x="${cx}" y="${cy+12*s}" font-size="${30*s}" font-weight="700">${esc(st.l2)}</text>`;
  if(st.l3&&!(mob&&st.l2))labels+=`<text x="${cx}" y="${cy+(st.l2?33:16)*s}" font-size="${12*s}">${esc(st.l3)}</text>`;
  labels+='</g>';
 }
 const sc=fs*(o.mini?1.4:1.1);
 const pins=(f.waters||[]).map(([x,y])=>`<g class="deco" transform="translate(${x} ${y}) scale(${sc})"><path d="M0,0 C-3,-6 -8,-9 -8,-15 A8,8 0 1 1 8,-15 C8,-9 3,-6 0,0 Z" fill="#2F6FED" stroke="#FFFFFF" stroke-width="1.5"/><circle cx="0" cy="-15" r="3" fill="#FFFFFF"/></g>`).join('');
 return `<svg class="map"${o.mini?' style="pointer-events:none"':''} viewBox="${x0-pd} ${y0-pd} ${W+2*pd} ${H+2*pd}" role="group" aria-label="${esc(o.label||'Mapa dos piquetes')}">${polys}${outl}${pins}${labels}</svg>`;
}
const restFill=r=>r<7?'#1E3A2B':r<14?'#2F6B4A':'#5DB383';
function stateFill(f){return p=>{
 if(!p.grazing)return{fill:'#18231C',ink:'#7F9286',l1:p.name,l3:'fora do pastejo',aria:p.name+', fora do pastejo'};
 const s=padState(f,p),m=modOfPad(f,p.id),dim=!!(S.filter&&(!m||m.id!==S.filter));
 if(s.kind==='occ'){const names=s.lots.map(id=>(lotOf(f,id)||{}).name).join(' + ');const late=m&&s.day>m.occ;
  return{fill:'#C6F24E',ink:'#0B120E',dim,ring:late?'#FF8A3D':null,l1:p.name+' · '+names,l2:nf(s.inst,2),l3:'UA/ha · dia '+s.day+'/'+(m?m.occ:'–'),aria:`${p.name}, ocupado por ${names}, ${nf(s.inst,2)} UA por hectare, dia ${s.day}`};}
 if(s.kind==='rest'){const fl=restFill(s.rest);return{fill:fl,ink:fl==='#5DB383'?'#0B120E':'#EEF3EC',dim,l1:p.name,l2:s.rest+' d',l3:s.ocorr!=null?'global '+nf(s.glob,2):'sem histórico',aria:`${p.name}, em descanso há ${s.rest} dias`};}
 return{fill:'#3A433E',ink:'#EEF3EC',dim,l1:p.name,l2:'?',l3:'descanso ?',aria:p.name+', descanso desconhecido'};
};}

function trend30(f){const A=gArea(f),out=[];for(let d=S.today-29;d<=S.today;d++){let u=0;for(const e of f.events){const end=e.end==null?S.today+1:e.end;const p=pad(f,e.pad);if(p&&p.grazing&&e.start<=d&&d<end)u+=e.ua;}out.push(A?u/A:0);}return out;}
function spark(vals,w,h,color,label){if(vals.length<2)return'';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-(v-mn)/r*(h-8)).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" ${label?`role="img" aria-label="${esc(label)}"`:'aria-hidden="true"'}><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;}
function rainMTD(f){const T=S.today,d0=dt(T),y=d0.getUTCFullYear(),mo=d0.getUTCMonth(),ma=dayUTC(y,mo,1),dim=dayUTC(y,mo+1,1)-ma;let val=0,cov=0;for(let d=ma;d<=T;d++){val+=rainVal(f,d);if(realR(f,d)!=null)cov++;}return{mo,val,cov,days:T-ma+1,norm:N_RAIN[mo]*f.rainMul*(T-ma+1)/dim,ma};}
function restReal(f,m){const T=S.today,rs=[];f.events.filter(e=>m.order.includes(e.pad)&&e.start>=T-90&&e.start<=T).forEach(e=>{const prev=f.events.filter(x=>x!==e&&x.pad===e.pad&&x.end!=null&&x.end<=e.start);if(!prev.length)return;const pe=Math.max(...prev.map(x=>x.end));if(pe===e.start)return;rs.push(e.start-pe);});return rs.length?sum(rs)/rs.length:null;}
function queueRow(f,x){const i=x.i,late=i.inN<=0,lot=lotOf(f,i.lotId)||{name:'—'};
 const when=late?`Atrasada ${1-i.inN} d`:i.inN===1?'Amanhã':`Em ${i.inN} dias`;
 return `<li class="li" style="gap:12px;padding:10px 8px 10px 12px;flex-wrap:wrap"><span class="pill" style="min-width:92px;text-align:center;background:${late?'#FF8A3D':i.inN<=1?'#C6F24E':'#223028'};color:${late||i.inN<=1?'#0B120E':'#EEF3EC'}">${when}</span>
 <span class="grow" style="min-width:150px"><span style="display:block;font-weight:600">${esc(lot.name)}: ${esc(pad(f,i.cur).name)} → ${esc(pad(f,i.next).name)}</span><span class="k">${esc(x.m.name)} · ${i.restAt!=null?`descanso na entrada ${i.restAt} d`:'descanso do destino desconhecido'}</span></span>
 <button type="button" class="btn sm" data-act="move" data-lot="${i.lotId}">Mover</button></li>`;}
function vPainel(f){
 const T=S.today,gp=gPads(f),A=gArea(f),st=gp.map(p=>padState(f,p));
 const nOcc=st.filter(s=>s.kind==='occ').length,nRest=st.length-nOcc;
 const uaP=sum(f.events.filter(e=>e.end==null).map(e=>e.ua)),upP=sum(f.events.filter(e=>e.end==null).map(uap)),uaT=sum(activeLots(f).map(uaLot));
 const tr=trend30(f),dlt=tr[29]-tr[0];
 const mods=f.modules.map(m=>({m,i:modInfo(f,m)}));
 const queue=mods.filter(x=>x.i.cur).sort((a,b)=>a.i.inN-b.i.inN);
 const rm=rainMTD(f),g=gmdAvg(f);
 const pct=rm.norm?Math.round((rm.val/rm.norm-1)*100):0;
 const alerts=[];
 activeLots(f).filter(l=>!openOfLot(f,l.id)).forEach(l=>alerts.push(`<div class="alert"><span><b>${esc(l.name)} sem piquete.</b> ${nf(uaLot(l),0)} UA fora da conta de lotação.</span><button type="button" class="btn sm" data-act="move" data-lot="${l.id}">Colocar em piquete</button></div>`));
 activeLots(f).forEach(l=>{const w=lastW(l);const age=w?T-w.day:null;if(!w||age>60)alerts.push(`<div class="alert info"><span><b>${esc(l.name)} ${w?`sem pesagem há ${age} dias`:'nunca pesado'}.</b> A UA usa ${w?'a última pesagem':'o peso padrão da categoria'}.</span><button type="button" class="btn sm" data-act="weigh" data-lot="${l.id}">Registrar pesagem</button></div>`);});
 try{const sc=projScope(projModel(f),'farm'),c0=sc.cap[1][0];if(c0>0&&sc.cur>c0*1.05)alerts.push(`<div class="alert"><span><b>Lotação de pasto ${Math.round((sc.cur/c0-1)*100)}% acima do que o pasto sustenta em ${MES[sc.mo[0].m]}.</b> ${nf(sc.cur,2)} contra ${nf(c0,2)} UA/ha no cenário normal.</span><button type="button" class="btn sm" data-act="goProj">Ver projeção</button></div>`);}catch(e){}
 if(realR(f,T)==null)alerts.push(`<div class="alert info"><span><b>Chuva de hoje sem registro.</b> Até lançar, o cálculo usa o estimado do centroide.</span><button type="button" class="btn sm" data-act="rain" data-day="${T}">Registrar chuva</button></div>`);
 const months=[];for(let k=5;k>=0;k--){const r=monthRange(k);let v=0;for(let d=r.a;d<r.b;d++)v+=rainVal(f,d);months.push({m:r.m,v,norm:N_RAIN[r.m]*f.rainMul*(r.b-r.a)/r.full});}
 const mx=Math.max(...months.map(x=>Math.max(x.v,x.norm)),10)*1.15;
 let rc='';months.forEach((x,i)=>{const gx=14+i*58,h=v=>v/mx*104;rc+=`<rect x="${gx}" y="${120-h(x.v)}" width="34" height="${h(x.v)}" rx="4" fill="${x.v>=x.norm?'#C6F24E':'#5DB383'}"/><line x1="${gx-4}" x2="${gx+38}" y1="${120-h(x.norm)}" y2="${120-h(x.norm)}" stroke="#EEF3EC" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${gx+17}" y="${114-h(Math.max(x.v,x.norm))}" text-anchor="middle" font-size="12" font-weight="600" fill="#EEF3EC">${Math.round(x.v)}</text><text x="${gx+17}" y="138" text-anchor="middle" font-size="12" fill="#9DB0A3">${MES[x.m]}</text>`;});
 const fc=[1,2,3].map(k=>T+k);
 return `<div class="view">
 <section class="row" aria-label="Resumo">
  <div class="hero col" style="flex:2 1 340px;gap:10px">
   <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between"><div style="display:flex;flex-direction:column;gap:6px"><div style="font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600">Lotação global da fazenda</div>
   <div class="big" style="font-size:64px">${A?nf(uaP/A,2):'–'} <span style="font-size:22px;letter-spacing:0">UA/ha</span></div></div>
   <div style="font-size:14px;line-height:1.5">${upP<uaP-0.5&&A?`<b>${nf(upP/A,2)} UA/ha de pasto</b> · ${Math.round((1-upP/uaP)*100)}% do cocho<br>`:''}${nf(uaP,0)} UA em pastejo · ${nf(A,1)} ha úteis${uaT-uaP>0.5?`<br>${nf(uaT-uaP,0)} UA fora dos piquetes`:''}</div></div>
   <div style="display:flex;align-items:center;gap:12px"><div style="flex-grow:1">${spark(tr,300,44,'#0B120E','Lotação global dos últimos 30 dias')}</div><span style="font-size:13px;font-weight:600;white-space:nowrap">${dlt>=0?'+':''}${nf(dlt,2)} em 30 dias</span></div>
  </div>

/* ---------- cartão do piquete ---------- */
function ovPad(f,p){
 const T=S.today,s=padState(f,p),m=modOfPad(f,p.id);
 const close=`<button type="button" class="iconbtn" data-act="close" aria-label="Fechar">${ic('x',20)}</button>`;
 const sub=`<div class="k" style="margin-top:-10px">${m?esc(m.name):(p.grazing?'Avulso':'Fora do pastejo')} · ${esc(p.species||'capim não informado')} · ${nf(p.area,1)} ha</div>`;
 const hd=(chip)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="big" style="font-size:32px">${esc(p.name)}</span><span style="display:flex;align-items:center;gap:6px">${chip}${close}</span></div>${sub}`;
 if(!p.grazing)return hd('<span class="pill" style="background:#18231C;color:#9DB0A3">Não pastejo</span>')+'<p class="k">Área fora do cálculo de lotação.</p>';
 if(s.kind==='occ'){
  const lots=s.lots.map(id=>lotOf(f,id)).filter(Boolean);const heads=sum(lots.map(l=>l.heads));const occ=m?m.occ:null;const late=occ&&s.day>occ;
  let nextName='—';if(m){const i=m.order.indexOf(p.id);nextName=pad(f,m.order[(i+1)%m.order.length]).name;}
  const segs=occ?`<div class="seg" aria-hidden="true">${[...Array(Math.max(occ,s.day))].map((_,k)=>`<i class="${k<s.day?(k<occ?'on':'late'):''}"></i>`).join('')}</div>`:'';
  return hd(`<span class="pill" style="background:${late?'#FF8A3D':'#C6F24E'};color:#0B120E">${late?'Atrasado':'Ocupado'}</span>`)+`
  <div style="background:#0B120E;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px"><div class="k">Lotação instantânea</div><div class="big" style="font-size:48px;color:#C6F24E">${nf(s.inst,2)} <span style="font-size:18px;color:#EEF3EC">UA/ha</span></div><div class="k" style="margin-top:4px">dia ${s.day}${occ?' de '+occ:''} em uso</div>${s.up<s.ua-0.5?`<div style="margin-top:8px;font-size:14px">De pasto: <b style="color:#6FA8FF">${nf(s.instP,2)} UA/ha</b> · suplemento ${lots.filter(l=>l.supl>0).map(l=>nf(l.supl,2)+'% do PV').join(' + ')}</div>`:''}</div>
  <dl class="kv"><div><dt>Lote</dt><dd>${lots.map(l=>esc(l.name+' · '+l.cat)).join('<br>')}</dd></div><div><dt>Animais</dt><dd>${nf(heads,0)} cab. · ${nf(s.ua,0)} UA</dd></div>
  <div><dt>Entrada</dt><dd>${fDW(s.start)}</dd></div><div><dt>Saída prevista</dt><dd>${occ?fDW(s.start+occ):'—'}</dd></div>
  <div><dt>Destino</dt><dd>${esc(nextName)}</dd></div><div><dt>Área</dt><dd>${nf(p.area,1)} ha</dd></div></dl>${segs}
  <button type="button" class="btn pri" data-act="move" data-lot="${lots[0]?lots[0].id:''}">${ic('move')} Mover lote</button>`;
 }
 let entry='—',restAt='';
 if(m){const mi=modInfo(f,m);if(mi.cur){const n=m.order.length,kk=(m.order.indexOf(p.id)-m.order.indexOf(mi.cur)+n)%n;if(kk>0){const ed=T+Math.max(mi.inN,0)+(kk-1)*m.occ;entry=fDW(ed);if(s.kind==='rest')restAt=(s.rest+ed-T)+' dias';}}}
 if(s.kind==='rest'&&s.ocorr!=null){const ln=(lotOf(f,s.lot)||{name:'—'}).name;
  return hd(`<span class="pill" style="background:${restFill(s.rest)};color:${restFill(s.rest)==='#5DB383'?'#0B120E':'#FFFFFF'}">Descanso · ${s.rest} ${pl(s.rest,'dia','dias')}</span>`)+`
  <div style="background:#0B120E;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:4px"><div class="k">Lotação ocorrida no último pastejo</div><div class="big" style="font-size:44px">${nf(s.ocorr,2)} <span style="font-size:17px">UA/ha</span> <span style="font-size:22px;color:#9DB0A3">× ${s.dias} ${pl(s.dias,'dia','dias')}</span></div><div class="k" style="margin-top:4px">fixa desde a saída</div></div>${s.ocorrP!=null&&s.ocorrP<s.ocorr-0.005?`<div class="alert info"><span>Descontando o suplemento, de pasto: ocorrida <b style="color:#6FA8FF">${nf(s.ocorrP,2)}</b> · global do ciclo <b style="color:#6FA8FF">${nf(s.globP,2)}</b> UA/ha</span></div>`:''}
  <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:0 4px"><div style="display:flex;flex-direction:column;gap:2px"><span class="k">Lotação global do ciclo</span><span class="k" style="font-size:12px">cai a cada dia vazio</span></div><span class="big" style="font-size:30px">${nf(s.glob,2)} <span style="font-size:14px;font-weight:500">UA/ha</span></span></div>
  <dl class="kv"><div><dt>Último lote</dt><dd>${esc(ln)} · ${nf(s.uaAvg,0)} UA</dd></div><div><dt>Pastejo</dt><dd>${fD(s.start)} a ${fD(s.end-1)}</dd></div>
  <div><dt>Próxima entrada</dt><dd>${entry}</dd></div><div><dt>Descanso na entrada</dt><dd>${restAt||'—'}</dd></div></dl>
  <button type="button" class="btn" data-act="move" data-dest="${p.id}">Colocar lote aqui</button>`;
 }
 if(s.kind==='rest')return hd(`<span class="pill" style="background:${restFill(s.rest)};color:#FFFFFF">Descanso · ${s.rest} d</span>`)+`<p style="margin:0;font-size:15px">Saiu gado em ${fDW(s.end)}. A lotação ocorrida aparece depois do primeiro pastejo registrado no app.</p><dl class="kv"><div><dt>Próxima entrada</dt><dd>${entry}</dd></div><div><dt>Descanso na entrada</dt><dd>${restAt||'—'}</dd></div></dl><button type="button" class="btn" data-act="move" data-dest="${p.id}">Colocar lote aqui</button>`;
 return hd('<span class="pill" style="background:#3A433E;color:#EEF3EC">Sem data</span>')+`<p style="margin:0;font-size:15px">Não se sabe quando saiu gado deste piquete. O descanso passa a contar na primeira saída registrada.</p><button type="button" class="btn" data-act="move" data-dest="${p.id}">Colocar lote aqui</button>`;
}

/* ---------- movimentação ---------- */
function padLabel(f,p){const s=padState(f,p);return s.kind==='occ'?'ocupado':s.kind==='rest'?'descanso '+s.rest+' d':'sem data';}
function ovMove(f){
 const o=S.ov,T=S.today;
 const lid=o.lot||(activeLots(f)[0]||{}).id;const lot=lotOf(f,lid);
 if(!lot)return `<h2 class="h2">Registrar movimentação</h2><p class="k">Cadastre um lote na aba Rebanho primeiro.</p><button type="button" class="btn" data-act="close">Fechar</button>`;
 const e=openStay(f,lid);
 let dest=o.dest;if(!dest&&e){const m=modOfPad(f,e.pad);if(m){const i=m.order.indexOf(e.pad);dest=m.order[(i+1)%m.order.length];}}
 if(!dest){const m=f.modules.find(x=>x.lotId===lid);if(m)dest=m.order[0];}
 return `<form class="col" data-act="doMove"><div class="head"><h2 class="h2">Registrar movimentação</h2><button type="button" class="iconbtn" data-act="close" aria-label="Fechar">${ic('x',20)}</button></div>
 <div class="field"><label for="mv-lot">Lote</label><select id="mv-lot" name="lot" class="in" data-chg="mvlot">${activeLots(f).map(l=>{const oe=openOfLot(f,l.id);return `<option value="${l.id}"${l.id===lid?' selected':''}>${esc(l.name)} · ${nf(uaLot(l),0)} UA · ${oe?'em '+esc(pad(f,oe.pad).name):'sem piquete'}</option>`;}).join('')}</select></div>
 <p class="k" style="margin:0">${e?`Está em <b style="color:var(--text)">${esc(pad(f,e.pad).name)}</b> desde ${fDW(e.start)} (dia ${T-e.start+1}).`:'Este lote não está em nenhum piquete.'}</p>
 <div class="field"><label for="mv-dest">Destino</label><select id="mv-dest" name="dest" class="in">${gPads(f).map(p=>`<option value="${p.id}"${p.id===dest?' selected':''}>${esc(p.name)} · ${padLabel(f,p)}${modOfPad(f,p.id)?' · '+esc(modOfPad(f,p.id).name):''}</option>`).join('')}</select></div>
 <div class="field"><label for="mv-date">Data da movimentação</label><input id="mv-date" name="date" type="date" class="in" value="${iso(T)}" max="${iso(T)}"${e?` min="${iso(e.start)}"`:''}></div>
 ${o.err?`<p class="err" role="alert">${esc(o.err)}</p>`:''}
 <div class="row" style="gap:10px"><button type="button" class="btn" data-act="close" style="flex:1 1 0">Cancelar</button><button type="submit" class="btn pri" style="flex:1 1 0">Confirmar</button></div></form>`;
}
function doMove(fm){
 const f=F(),fd=new FormData(fm),lid=fd.get('lot'),dest=fd.get('dest'),d=fromIso(fd.get('date')),T=S.today;
 const fail=m=>{S.ov=Object.assign({},S.ov,{lot:lid,dest,err:m});renderOv();};
 if(!lid||!dest)return fail('Escolha o lote e o destino.');
 if(isNaN(d))return fail('Informe a data.');
 if(d>T)return fail('A data não pode ser depois de hoje.');
 const err=mutate(f,()=>{const l=lotOf(f,lid);if(d<firstDay(l))return `${l.name} foi formado em ${fD(firstDay(l))}.`;const st=openStay(f,lid);
  if(st&&st.pad===dest)return 'O lote já está nesse piquete.';
  if(st&&d<st.start)return `A entrada atual foi em ${fD(st.start)}; a saída não pode ser antes disso.`;
  if(st){if(d===st.start)f.stays.splice(f.stays.indexOf(st),1);else st.end=d;}
  f.stays.push({id:uid('s'),lot:lid,pad:dest,start:d,end:null});});
 if(err)return fail(err);
 S.ov=null;toast(`${lotOf(f,lid).name} → ${pad(f,dest).name}`);render();
}

function vMod(f){

 const list=`<aside class="col" style="flex:1 1 240px;min-width:0" aria-label="Lista de módulos">
  ${f.modules.map(m=>{const i=modInfo(f,m),ed=D&&D.id===m.id;return `<button type="button" class="card modc" data-act="editMod" data-id="${m.id}" aria-pressed="${!!ed}" style="flex:none;padding:16px">
   <span style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%"><span style="display:flex;align-items:center;gap:8px"><span class="sw" style="background:${m.color}"></span><span style="font-family:'Space Grotesk',Inter,sans-serif;font-size:18px;font-weight:600">${esc(m.name)}</span></span>${ed?'<span style="font-size:12px;font-weight:600;color:var(--lime)">editando</span>':''}</span>
   <span class="k">${m.order.map(id=>esc(pad(f,id).name)).join(' · ')||'sem piquetes'}</span>
   <span class="k">${nf(i.area,0)} ha · ${esc((lotOf(f,m.lotId)||{name:'sem lote'}).name)} · ${m.occ} d de ocupação</span></button>`;}).join('')}
  <button type="button" class="btn" data-act="newMod" style="border-style:dashed;min-height:48px">${ic('plus')} Novo módulo</button>
  <p class="k" style="margin:0 4px">Avulsos: ${gPads(f).filter(p=>!modOfPad(f,p.id)).map(p=>esc(p.name)).join(', ')||'nenhum'}</p></aside>`;
 let fill;
 if(D){fill=p=>{if(!p.grazing)return{fill:'#18231C',ink:'#7F9286',l1:p.name,l3:'fora do pastejo',aria:p.name+', fora do pastejo'};
  const i=D.order.indexOf(p.id);if(i>=0)return{fill:'#C6F24E',ink:'#0B120E',badge:i+1,l1:p.name,l3:nf(p.area,1)+' ha',aria:`${p.name}, posição ${i+1} no módulo em edição`};
  const m=modOfPad(f,p.id);if(m&&m.id!==D.id)return{fill:m.color,op:0.55,ink:'#EEF3EC',l1:p.name,l3:m.name,aria:`${p.name}, no ${m.name}`};
  return{fill:'#26342B',ink:'#EEF3EC',l1:p.name,l3:'avulso',aria:p.name+', avulso'};};}
 else fill=p=>{if(!p.grazing)return{fill:'#18231C',ink:'#7F9286',l1:p.name,l3:'fora do pastejo',aria:p.name};const m=modOfPad(f,p.id);return m?{fill:m.color,op:0.75,ink:'#EEF3EC',l1:p.name,l3:m.name,aria:`${p.name}, ${m.name}`}:{fill:'#26342B',ink:'#EEF3EC',l1:p.name,l3:'avulso',aria:p.name+', avulso'};};
 const mapc=`<section class="card col" style="flex:999 1 500px" aria-label="Mapa de seleção"><div class="head"><h2 class="h2">${D?'Toque para incluir ou tirar':'Piquetes por módulo'}</h2>
  <div class="legend">${D?'<span><i class="sw" style="background:#C6F24E"></i>No módulo em edição</span>':''}${f.modules.filter(m=>!D||m.id!==D.id).map(m=>`<span><i class="sw" style="background:${m.color}"></i>${esc(m.name)}</span>`).join('')}<span><i class="sw" style="background:#26342B;border:1px solid #35483C"></i>Avulso</span></div></div>
  ${mapSVG(f,fill,{label:'Mapa de seleção de piquetes'})}<p class="k" style="margin:0">${D?'Os números mostram a ordem de rotação. Um piquete de outro módulo sai de lá quando você salvar.':'Toque num piquete ou num módulo da lista para editar.'}</p></section>`;
 let panel='';
 if(D){
  const pads=D.order.map(id=>pad(f,id)),area=sum(pads.map(p=>p.area)),lot=lotOf(f,D.lotId),n=D.order.length;
  const moves=D.order.map(id=>({p:pad(f,id),m:modOfPad(f,id)})).filter(x=>x.m&&x.m.id!==D.id);

function doAlter(fm){

  const l=lotOf(f,lid);if(d<firstDay(l))return `${l.name} foi formado em ${fDY(firstDay(l))}.`;
  const st=stateAt(l._tl,d)||{h:0,w:l.weight};

   const s=f.stays.find(x=>x.lot===l.id&&x.start<=d&&(x.end==null||d<x.end));if(s)f.stays.push({id:uid('s'),lot:dest.id,pad:s.pad,start:d,end:null});}
  else{dest=lotOf(f,to);if(!dest)return 'Escolha o lote de destino.';if(d<firstDay(dest))return `${dest.name} foi formado em ${fDY(firstDay(dest))}.`;dest.log.push({id:uid('g'),seq:++f.seq,day:d,type:'transf_in',n,kg:r1(st.w),other:l.name,link});}
  l.log.push({id:uid('g'),seq:++f.seq,day:d,type:'transf_out',n,other:dest.name,link});msg=`${n} cab.: ${l.name} → ${dest.name}`;
 });

/* ---------- PROJEÇÃO: P = M × PPR × FH + N × RN (Tonato, Barioni e Pedreira; N de Martha Jr.) ---------- */
const UA_MS=450*INTAKE/100;
const COND={ext:{n:'Extensiva',M:40,lo:30,hi:80},adu:{n:'Adubada',M:105,lo:100,hi:180}};
const SCEN=[['Seco',0.75],['Normal',1],['Chuvoso',1.25]];
const TOT=30,MTETO=250,NDIAS=60;
const TB=sp=>/decumbens|humid/i.test(sp||'')?15.5:16.5;
const PPR=(t,tb)=>t>=TOT?1:Math.max(0,(t-tb)/(TOT-tb));
const pj=f=>Object.assign({efic:0.5,cad:75,rn:26},f.proj||{});
function mOff(k){const d=dt(S.today),y=d.getUTCFullYear(),m=d.getUTCMonth()+k;return{a:dayUTC(y,m,1),b:dayUTC(y,m+1,1),m:((m%12)+12)%12,y:new Date(Date.UTC(y,m,1)).getUTCFullYear()};}
function eto(f,d){const t=temps(f,d),tm=(t[0]+t[1])/2,x=dt(d),J=Math.round((Date.UTC(x.getUTCFullYear(),x.getUTCMonth(),x.getUTCDate())-Date.UTC(x.getUTCFullYear(),0,0))/864e5),phi=f.centroid.lat*Math.PI/180,dr=1+0.033*Math.cos(2*Math.PI*J/365),de=0.409*Math.sin(2*Math.PI*J/365-1.39),ws=Math.acos(Math.max(-1,Math.min(1,-Math.tan(phi)*Math.tan(de)))),Ra=24*60/Math.PI*0.082*dr*(ws*Math.sin(phi)*Math.sin(de)+Math.cos(phi)*Math.cos(de)*Math.sin(ws));return Math.max(0,0.0023*(tm+17.8)*Math.sqrt(Math.max(0,t[1]-t[0]))*Ra*0.408);}
const kcM=m=>m>=5&&m<=7?0.6:(m===11||m<=1)?1.2:0.9;
function climSeries(f,fac){const p=pj(f),T=S.today,out={};let s=p.cad/2;
 for(let k=-24;k<=12;k++){const r=mOff(k),mm=f.centroid.lat<0?r.m:(r.m+6)%12;let etr=0,etm=0,ts=0,rn=0;
  for(let d=r.a;d<r.b;d++){const rain=d<=T?rainVal(f,d):rainEst(f,d)*fac,em=eto(f,d)*kcM(mm),av=s+rain,er=Math.min(av,em*Math.min(1,av/(0.5*p.cad)));s=Math.min(p.cad,av-er);etr+=er;etm+=em;const t=temps(f,d);ts+=(t[0]+t[1])/2;rn+=rain;}
  const q=etm?etr/etm:1;out[k]=Object.assign({k,rain:rn,T:ts/(r.b-r.a),ratio:q,FH:q>=0.5?1:2*q,days:r.b-r.a},r);}
 return out;}
function projUnits(f){
 const us=f.modules.map(m=>({id:m.id,name:m.name,color:m.color,pads:m.order.map(id=>pad(f,id)).filter(p=>p&&p.grazing),cond:m.cond||'ext',Mc:m.M}));
 const av=gPads(f).filter(p=>!modOfPad(f,p.id));if(av.length)us.push({id:'_av',name:'Avulsos',color:'#3A433E',pads:av,cond:(f.proj||{}).avCond||'ext',Mc:(f.proj||{}).avM});
 us.forEach(u=>{u.area=sum(u.pads.map(p=>p.area));u.tb=u.area?sum(u.pads.map(p=>TB(p.species)*p.area))/u.area:16.5;u.Mref=u.Mc>0?u.Mc:COND[u.cond].M;});
 return us.filter(u=>u.area>0);}
function projModel(f){
 const p=pj(f),T=S.today,cl=SCEN.map(x=>climSeries(f,x[1])),us=projUnits(f),fert=f.fert||[],WS=[1,0.8,0.65,0.5,0.4,0.3,0.25,0.2];
 us.forEach(u=>{
  u.cur=sum(f.events.filter(e=>e.end==null&&u.pads.some(q=>q.id===e.pad)).map(uap))/u.area;
  u.obs={};for(let k=-11;k<=0;k++){const r=mOff(k),b=Math.min(r.b,T+1);if(b-r.a<1)continue;let ud=0;u.pads.forEach(q=>{ud+=padYear(f,q,r.a,b).udp;});u.obs[k]=ud/u.area/(b-r.a);}
  u.G=[];u.N=[];u.ppr={};
  for(let s=0;s<3;s++){u.G[s]={};u.N[s]={};for(let k=-24;k<=12;k++){const c=cl[s][k];u.G[s][k]=PPR(c.T,u.tb)*c.FH;let n=0;
   fert.forEach(x=>{const q=u.pads.find(z=>z.id===x.pad);if(!q)return;const ov=Math.max(0,Math.min(c.b,x.day+NDIAS)-Math.max(c.a,x.day));if(ov>0)n+=x.n*p.rn*c.FH*(ov/NDIAS)*q.area/u.area/c.days;});u.N[s][k]=n;}}
  for(let k=-11;k<=12;k++)u.ppr[k]=PPR(cl[1][k].T,u.tb);
  const sm={},smooth=(s,w)=>{const key=s+'_'+w;if(!sm[key]){const o={};let g=u.G[s][-24];for(let k=-24;k<=12;k++){g=w*u.G[s][k]+(1-w)*g;o[k]=g;}sm[key]=o;}return sm[key];},ge=(s,k,w)=>smooth(s,w)[k];
  const ks=[];for(let k=-11;k<=0;k++){const r=mOff(k);if(u.obs[k]>0&&Math.min(r.b,T+1)-r.a>=10)ks.push(k);}
  let best=null;
  if(ks.length>=6)WS.forEach(w=>{let sxy=0,sxx=0;ks.forEach(k=>{const x=ge(1,k,w)*p.efic/UA_MS,y=u.obs[k]-u.N[1][k]*p.efic/UA_MS;sxy+=x*y;sxx+=x*x;});if(!sxx)return;const M=sxy/sxx;if(!(M>0))return;let sse=0;ks.forEach(k=>{const e=(M*ge(1,k,w)+u.N[1][k])*p.efic/UA_MS-u.obs[k];sse+=e*e;});if(!best||sse<best.sse-1e-12)best={M,w,sse};});
  u.Mcal=best?best.M:null;u.calUsed=!!(best&&S.projM!=='ref');u.M=u.calUsed?best.M:u.Mref;u.w=u.calUsed?best.w:0.4;
  u.Ge=[];u.P=[];u.cap=[];for(let s=0;s<3;s++){u.Ge[s]={};u.P[s]={};u.cap[s]={};for(let k=-11;k<=12;k++){u.Ge[s][k]=ge(s,k,u.w);u.P[s][k]=u.M*u.Ge[s][k]+u.N[s][k];u.cap[s][k]=u.P[s][k]*p.efic/UA_MS;}}

function projScope(mdl,scope){
 const us=scope==='farm'?mdl.us:mdl.us.filter(u=>u.id===scope),area=sum(us.map(u=>u.area)),w=fn=>area?sum(us.map(u=>fn(u)*u.area))/area:0;
 const sc={us,area,name:scope==='farm'?'Fazenda':us[0].name,cur:w(u=>u.cur),obs:{},cap:[{},{},{}],ppr:{},mo:mdl.cl[1]};
 for(let k=-11;k<=12;k++){if(k<=0)sc.obs[k]=w(u=>u.obs[k]||0);sc.ppr[k]=w(u=>u.ppr[k]);for(let s=0;s<3;s++)sc.cap[s][k]=w(u=>u.cap[s][k]);}
 return sc;}
function nPlan(mdl,scope,meta){
 const p=mdl.p,us=scope==='farm'?mdl.us:mdl.us.filter(u=>u.id===scope),rows=[];
 for(let k=0;k<=11;k++){const c=mdl.cl[1][k];let kgN=0,defUA=0,teto=false,area=0,cap=0;
  us.forEach(u=>{const need=meta*UA_MS/p.efic,def=Math.max(0,need-u.P[1][k]);area+=u.area;cap+=u.cap[1][k]*u.area;if(def<=0)return;
   if(need>MTETO*u.Ge[1][k]+u.N[1][k])teto=true;
   if(c.FH<0.5){defUA+=(meta-u.cap[1][k])*u.area;return;}
   kgN+=def*c.days/(p.rn*c.FH)*u.area;});
  rows.push({k,c,kgN,nha:area?kgN/area:0,defUA,teto,block:c.FH<0.5,cap:area?cap/area:0});}
 return rows;}

 ks.filter(k=>k<=0&&sc.obs[k]>0).forEach(k=>{const h=sc.obs[k]/mx*170;s+=`<rect x="${X(k)-cw*0.36}" y="${yb-h}" width="${cw*0.72}" height="${h}" rx="3" fill="#C6F24E"${k===0?' fill-opacity="0.55"':''}/>`;});
 const fut=ks.filter(k=>k>=0);
 s+=`<polygon points="${fut.map(k=>X(k)+','+Y(sc.cap[2][k]).toFixed(1)).join(' ')} ${fut.slice().reverse().map(k=>X(k)+','+Y(sc.cap[0][k]).toFixed(1)).join(' ')}" fill="#6FA8FF" fill-opacity="0.25"/>`;
 s+=`<polyline points="${ks.map(k=>X(k).toFixed(1)+','+Y(sc.cap[1][k]).toFixed(1)).join(' ')}" fill="none" stroke="#6FA8FF" stroke-width="2.5" stroke-linejoin="round"/>`;
 s+=`<line x1="${X(0)}" x2="${X(12)}" y1="${Y(sc.cur)}" y2="${Y(sc.cur)}" stroke="#FF8A3D" stroke-width="2" stroke-dasharray="6 5"/>`;
 s+=`<line x1="${X(0)+cw/2}" x2="${X(0)+cw/2}" y1="14" y2="${yb}" stroke="#EEF3EC" stroke-opacity="0.4"/><text x="${X(0)+cw/2+5}" y="22" font-size="11" fill="#9DB0A3">projeção</text><text x="${X(0)+cw/2-5}" y="22" text-anchor="end" font-size="11" fill="#9DB0A3">ocorrido</text>`;
 ks.forEach(k=>{s+=`<text x="${X(k)}" y="${yb+16}" text-anchor="middle" font-size="10" fill="${k===0?'#EEF3EC':'#9DB0A3'}"${k===0?' font-weight="700"':''}>${MES[sc.mo[k].m]}</text>`;if(sc.mo[k].m===0||k===-11)s+=`<text x="${X(k)}" y="${yb+31}" text-anchor="middle" font-size="10" fill="#7F9286">${sc.mo[k].y}</text>`;});
 return `<svg viewBox="0 0 ${W} 238" role="img" aria-label="Lotação de pasto ocorrida nos últimos 12 meses e capacidade projetada para os próximos 12: ${fut.map(k=>MES[sc.mo[k].m]+' '+nf(sc.cap[1][k],2)).join(', ')} UA por hectare no cenário normal. Lotação atual ${nf(sc.cur,2)}." style="width:100%;height:auto">${s}</svg>`;}

 const ll=([x,y])=>[(lon0+(x-400)*M*kx).toFixed(6),(lat0-(y-260)*M*ky).toFixed(6)];

 const poly=(n,p)=>`<Placemark><name>${n}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${ring(p)}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark>`;

 case'altKind':S.ov=Object.assign({},S.ov,{kind:d.v,err:null});renderOv();break;
 case'doAlter':doAlter(el);break;
 case'goMod':startDraft(f,d.id);location.hash='modulos';break;
 case'addLot':addLot(el);break;
 case'rank':S.rank=d.v;render();break;
 case'anView':S.anView=d.v;render();break;
 case'goProj':S.anView='proj';S.projScope='farm';S.projMeta=null;if(location.hash==='#analise')render();else location.hash='analise';break;
 case'pscope':S.projScope=d.id;S.projMeta=null;render();break;
 case'pM':S.projM=d.v;render();break;
 case'fert':S.ov={type:'fert',pad:d.pad||null};renderOv();break;
 case'doFert':doFert(el);break;
 case'delFert':if(S.fertDel!==d.id){S.fertDel=d.id;render();break;}f.fert=(f.fert||[]).filter(x=>x.id!==d.id);S.fertDel=null;toast('Adubação excluída');render();break;
 case'wizStart':S.ov=null;S.wiz={step:1,name:'',city:'',owner:'',kml:null,kmlErr:null,species:{},sel:[],modules:[],lots:[],sit:{lots:{},pads:{}},err:null};renderOv();break;
 case'wizClose':S.wiz=null;renderOv();break;
 case'wizBack':S.wiz.step=Math.max(1,S.wiz.step-1);S.wiz.sel=[];S.wiz.err=null;renderOv();break;
 case'wizNext':if(S.wiz.step===6)return wizFinish();S.wiz.step++;S.wiz.sel=[];S.wiz.err=null;renderOv();break;
 case'kmlex':try{S.wiz.kml=parseKML(exampleKML());S.wiz.kmlErr=null;if(!S.wiz.name)S.wiz.name='Fazenda Nova';}catch(e){S.wiz.kmlErr=e.message;}resetWizDeps();renderOv();break;
 case'wsp':S.wiz.sel.forEach(id=>S.wiz.species[id]=d.sp);S.wiz.sel=[];renderOv();break;
 case'wselmiss':S.wiz.sel=S.wiz.kml.pads.filter(p=>p.grazing&&!S.wiz.species[p.id]).map(p=>p.id);renderOv();break;
 case'wmod':{const w=S.wiz,L='ABCDEFGHIJKLMNOP';w.modules.forEach(m=>m.order=m.order.filter(id=>!w.sel.includes(id)));w.modules=w.modules.filter(m=>m.order.length);const used=new Set(w.modules.map(m=>m.name));let i=0;while(used.has('Módulo '+L[i]))i++;const uc=new Set(w.modules.map(m=>m.color));w.modules.push({id:uid('m'),name:'Módulo '+L[i],color:MOD_COLORS.find(c=>!uc.has(c))||MOD_COLORS[0],order:w.sel.slice(),lotId:null,occ:5});w.sel=[];renderOv();break;}
 case'wmodrem':S.wiz.modules.splice(+d.i,1);renderOv();break;
 case'wlot':{const fd=new FormData(el),h=parseInt(fd.get('heads'),10),wt=parseFloat(fd.get('weight'));if(!(h>0)||!(wt>0)){S.wiz.err='Informe cabeças e peso.';S._noFocus=true;return renderOv();}S.wiz.err=null;S.wiz.lots.push({id:uid('l'),name:String(fd.get('name')||'').trim()||'Lote '+(S.wiz.lots.length+1),cat:fd.get('cat'),heads:h,weight:wt});renderOv();setTimeout(()=>{const n=document.getElementById('wl-n');if(n)n.focus();},0);break;}
 case'wlotrem':{const l=S.wiz.lots.splice(+d.i,1)[0];if(l)delete S.wiz.sit.lots[l.id];renderOv();break;}
 }
}
function resetWizDeps(){const w=S.wiz;w.species={};w.sel=[];w.modules=[];w.sit={lots:{},pads:{}};}
function wizPad(id){
 const w=S.wiz,p=w.kml&&w.kml.pads.find(x=>x.id===id);if(!p)return;
 if(w.step===2){p.grazing=!p.grazing;w.modules.forEach(m=>m.order=m.order.filter(x=>x!==id));}
 else if(w.step===3||w.step===4){if(!p.grazing)return;const i=w.sel.indexOf(id);if(i>=0)w.sel.splice(i,1);else w.sel.push(id);}
 else return;
 S._noFocus=true;renderOv();
}
function onChange(el){
 const c=el.dataset.chg,f=F(),w=S.wiz;
 switch(c){
 case'altTo':S.ov=Object.assign({},S.ov,{to:el.value});renderOv();break;
 case'pmeta':{const v=parseFloat(String(el.value).replace(',','.'));S.projMeta=v>=0?v:null;render();break;}
 case'pjparam':{const v=parseFloat(el.value),k=el.dataset.k;f.proj=Object.assign({},f.proj||{});if(k==='efic'&&v>=10&&v<=90)f.proj.efic=v/100;if(k==='cad'&&v>=20&&v<=250)f.proj.cad=v;if(k==='rn'&&v>=5&&v<=83)f.proj.rn=v;render();break;}
 case'ucond':{const id=el.dataset.id;if(id==='_av'){f.proj=Object.assign({},f.proj||{},{avCond:el.value,avM:null});}else{const m=f.modules.find(x=>x.id===id);if(m){m.cond=el.value;m.M=null;}}render();break;}
 case'uM':{const id=el.dataset.id,v=parseFloat(el.value);if(!(v>0&&v<=400)){render();break;}if(id==='_av'){f.proj=Object.assign({},f.proj||{},{avM:v});}else{const m=f.modules.find(x=>x.id===id);if(m)m.M=v;}render();break;}
 case'mvlot':S.ov={type:'move',lot:el.value,dest:null};renderOv();break;
 case'dlot':S.draft.lotId=el.value;render();break;
 case'docc':S.draft.occ=Math.max(1,parseInt(el.value,10)||1);render();break;
 case'dvig':{const v=fromIso(el.value);if(!isNaN(v))S.draft.vig=Math.min(v,S.today);break;}
 case'nlcat':{const wEl=document.getElementById('nl-w');if(wEl)wEl.value=catW(el.value);break;}
 case'wcat':{const wEl=document.getElementById('wl-w');if(wEl)wEl.value=catW(el.value);break;}
 case'kmlfile':{const file=el.files&&el.files[0];if(!file)break;readKmlFile(file).then(t=>{w.kml=parseKML(t);w.kmlErr=null;if(!w.name)w.name=file.name.replace(/\.(kml|kmz)$/i,'');resetWizDeps();renderOv();}).catch(e=>{w.kmlErr=e.message||'Não foi possível ler o arquivo.';renderOv();});break;}
 case'wgraz':{const p=w.kml.pads.find(x=>x.id===el.dataset.id);p.grazing=el.checked;w.modules.forEach(m=>m.order=m.order.filter(x=>x!==p.id));S._noFocus=true;renderOv();break;}
 case'wsitpad':{const s=w.sit.lots[el.dataset.id]=w.sit.lots[el.dataset.id]||{};s.pad=el.value||null;if(s.date==null)s.date=S.today;renderOv();break;}
 case'wsitdate':{const s=w.sit.lots[el.dataset.id]=w.sit.lots[el.dataset.id]||{};const v=fromIso(el.value);s.date=isNaN(v)?S.today:Math.min(v,S.today);break;}
 case'wpdate':{const s=w.sit.pads[el.dataset.id]=w.sit.pads[el.dataset.id]||{unk:true};const v=fromIso(el.value);s.date=isNaN(v)?null:Math.min(v,S.today);s.unk=s.date==null;break;}
 case'wpunk':{const s=w.sit.pads[el.dataset.id]=w.sit.pads[el.dataset.id]||{};s.unk=el.checked;if(!s.unk&&s.date==null)s.date=S.today-14;renderOv();break;}
 }
}
function readKmlFile(file){
 if(/\.kmz$/i.test(file.name)){
  if(typeof JSZip==='undefined')return Promise.reject(new Error('Leitor de KMZ não carregou. Tente um arquivo KML.'));
  return JSZip.loadAsync(file).then(z=>{const n=Object.keys(z.files).find(x=>/\.kml$/i.test(x));if(!n)throw new Error('O KMZ não tem KML dentro.');return z.files[n].async('string');});
 }
 return file.text();
}
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.tagName==='FORM')return;if(t.disabled)return;act(t.dataset.act,t);});
document.addEventListener('submit',ev=>{ev.preventDefault();const t=ev.target;if(t.dataset.act)act(t.dataset.act,t);});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset&&t.dataset.chg)onChange(t);});
document.addEventListener('input',ev=>{const t=ev.target,b=t.dataset&&t.dataset.bind;if(!b)return;const[o,k]=b.split('.');if(o==='draft'&&S.draft)S.draft[k]=t.value;if(o==='supl'&&S.ov&&S.ov.type==='supl'){S.ov.pct=t.value;const pv=document.getElementById('sp-prev');if(pv)pv.innerHTML=suplPrev(lotOf(F(),S.ov.lot),t.value);}if(o==='wiz'&&S.wiz){S.wiz[k]=t.value;const nb=document.querySelector('[data-act=wizNext]');if(nb&&S.wiz.step===1)nb.disabled=!t.value.trim()&&k==='name'?true:!S.wiz.name.trim();}});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){if(S.wiz)return;if(S.ov){S.ov=null;renderOv();}return;}
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.getAttribute&&ev.target.getAttribute('role')==='button'&&ev.target.tagName!=='BUTTON'&&ev.target.dataset&&ev.target.dataset.act){ev.preventDefault();act(ev.target.dataset.act,ev.target);}
});
function route(){const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h)||h==='modulos'){if(S.view!==h){S.view=h;if(h!=='modulos')S.draft=null;}}render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);
let lastMob=window.innerWidth<700,rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{const m=window.innerWidth<700;if(m!==lastMob){lastMob=m;S._noFocus=true;render();}},200);});
S=load();
route();
</script>
